# Default values for EKS cluster config.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

applicationName: bsee
# -- Name of the persistent volume claim used for shared storage between the DAST Pods
persistentVolumeClaim: bsee-pvc
# -- The container registry used to get the DAST images
containerRegistry: "public.ecr.aws"
imagePullSecrets: []

# -- Pod-level securityContext for all DAST deployments. Set a field to null to remove it,
podSecurityContext:
  runAsUser: 42877
  runAsGroup: 42877
  fsGroup: 42877
  fsGroupChangePolicy: OnRootMismatch
# -- Container-level securityContext for all DAST containers and init containers.
containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsUser: 42877
  capabilities:
    drop:
      - ALL

maxCpuPerContainer: 4000m
minCpuPerContainer: 100m
defaultCpuPerContainer: 100m
defaultRequestCpuPerContainer: 100m

maxMemoryPerContainer: 8Gi
minMemoryPerContainer: 128Mi
defaultMemoryPerContainer: 128Mi
defaultRequestMemoryPerContainer: 128Mi

webServerContainerCpu: 1400m
webServerContainerMemory: 4Gi
enterpriseServerContainerCpu: 1400m
enterpriseServerContainerMemory: 4Gi
scanContainerCpu: 1400m
scanContainerMemory: 8Gi
scanControllerCpu: 500m
scanControllerMemory: 512Mi

services:
  webServer:
    installationEnvironment: KUBERNETES
    label: "app.portswigger.net/ingress: web-server"
    useHttps: false
    httpPort: "8080"
    httpsPort: "8443"
    httpsCertificateSecret:
      name: bsee-web-server-https
      key: certificate
    httpsPassphraseSecret:
      name: bsee-web-server-https
      key: passphrase
    # -- Annotations added to the web-server Service, e.g. cloud load-balancer annotations
    annotations: {}
    # -- Kubernetes Service type for the web-server Service ("ClusterIP", "LoadBalancer" or "NodePort").
    # Uses the cluster default (ClusterIP) when unset.
    type: ""
    # -- Existing Secret to use instead of the chart-managed web server Secret.
    # Must contain BSEE_CLIENT_KEYSTORE_PASSWORD and BSEE_CLIENT_TRUSTSTORE_PASSWORD.
    existingSecret: ""
  enterpriseServer:
    installationEnvironment: KUBERNETES
    # -- Existing Secret to use instead of the chart-managed DAST server Secret. Must contain
    # BSEE_HTTPS_KEYSTORE_PASSWORD, BSEE_ADMIN_REPOSITORY_* and BSEE_AGENT_REPOSITORY_* (optionally
    # *_CONNECTION_USERNAME). The database.* username/password values are ignored when set.
    existingSecret: ""

scanningSharedSecret:
  # -- Name of an existing Secret containing the key BSEE_HOSTED_SCANNING_MACHINE_API_KEY.
  # When set, the chart does not create or regenerate the scanning shared secret.
  existingSecret: ""

relaySharedSecret:
  # -- Name of an existing Secret containing the keys RELAY_SECRET and BSEE_REQUEST_RELAY_SECRET, both set to the same value.
  # When set, the chart does not create or regenerate the relay shared secret.
  existingSecret: ""

limitRange:
  # -- Create the LimitRange for the DAST namespace. Set to false where LimitRanges are managed centrally.
  enabled: true

database:
  # -- JDBC connection URL for the database
  url: ""
  # -- Username for the DAST Server database connection
  enterpriseServerUsername: ""
  # -- Connection username for the DAST Server database connection.
  # Required if connection username differs from internal username e.g. if @hostname suffix is mandated (Azure)
  enterpriseServerConnectionUsername: ""
  # -- Password for the DAST Server database connection
  enterpriseServerPassword: ""
  # -- Username for the Scanning Resource database connection
  scanningResourceUsername: ""
  # -- Connection username for the Scanning Resource database connection
  # Required if connection username differs from internal username e.g. if @hostname suffix is mandated (Azure)
  scanningResourceConnectionUsername: ""
  # -- Password for the Scanning Resource database connection
  scanningResourcePassword: ""
  # -- (int) Idle timeout (ms) for the database connection
  idleTimeout: 60000
  # -- (int) Maximum lifetime timeout (ms) for the database connection
  maxLifetimeTimeout: 120000