{{- if not .Values.services.webServer.existingSecret -}}
{{- $secretName := printf "%s-web-server-secret" (include "kebabcase-release-name" .) -}}
{{- $password := include "secret-field-value" (dict "context" . "name" $secretName "key" "BSEE_CLIENT_KEYSTORE_PASSWORD" "length" 20) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kebabcase-release-name" . }}-web-server-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: web-server
    app.kubernetes.io/component: server
{{ include "recommended-labels" . | indent 4 }}
data:
  BSEE_CLIENT_KEYSTORE_PASSWORD: {{ $password | quote }}
  BSEE_CLIENT_TRUSTSTORE_PASSWORD: {{ $password | quote }}
{{- end }}
