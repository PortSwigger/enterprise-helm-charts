{{- if not (default dict .Values.relaySharedSecret).existingSecret -}}
{{- $secretName := printf "%s-relay-shared-secret" (include "kebabcase-release-name" .) -}}
{{- $relaySecret := include "secret-field-value" (dict "context" . "name" $secretName "key" "RELAY_SECRET" "length" 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kebabcase-release-name" . }}-relay-shared-secret
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "recommended-labels" . | indent 4 }}
data:
  BSEE_REQUEST_RELAY_SECRET: {{ $relaySecret | quote }}
  RELAY_SECRET: {{ $relaySecret | quote }}
{{- end }}
