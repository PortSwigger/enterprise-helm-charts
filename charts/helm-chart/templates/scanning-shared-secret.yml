{{- if not (default dict .Values.scanningSharedSecret).existingSecret -}}
{{- $secretName := printf "%s-scanning-shared-secret" (include "kebabcase-release-name" .) -}}
{{- $apiKey := include "secret-field-value" (dict "context" . "name" $secretName "key" "BSEE_HOSTED_SCANNING_MACHINE_API_KEY" "length" 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kebabcase-release-name" . }}-scanning-shared-secret
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "recommended-labels" . | indent 4 }}
data:
  BSEE_HOSTED_SCANNING_MACHINE_API_KEY: {{ $apiKey | quote }}
{{- end }}
